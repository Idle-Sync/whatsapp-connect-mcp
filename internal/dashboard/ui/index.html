<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whatsapp-connect-mcp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>whatsapp-connect-mcp</h1>
  <div id="health">
    <span id="state" class="badge">…</span>
    <span id="health-detail"></span>
  </div>
</header>
<nav>
  <button data-tab="status" class="active">Status</button>
  <button data-tab="pair">Pair</button>
  <button data-tab="chats">Chats</button>
  <button data-tab="trust">Trust</button>
  <button data-tab="schedules">Schedules</button>
  <button data-tab="drafts">Drafts</button>
  <button data-tab="backup">Backup</button>
</nav>
<main>
  <section id="tab-status">
    <table id="status-table"></table>
    <h2>Doctor</h2>
    <table id="doctor-table"></table>
  </section>
  <section id="tab-pair" hidden>
    <p id="pair-msg"></p>
    <img id="pair-qr" alt="QR code" hidden>
    <button id="pair-start">Start pairing</button>
  </section>
  <section id="tab-chats" hidden>
    <input id="search-box" placeholder="Search messages (or leave empty and pick a chat)">
    <button id="search-go">Search</button>
    <div id="chats-list"></div>
    <h2 id="messages-title" hidden></h2>
    <table id="messages-table"></table>
  </section>
  <section id="tab-trust" hidden>
    <p>Trusted contacts auto-send without a draft preview. Add only people you'd let an agent message directly.</p>
    <input id="trust-jid" placeholder="15551234567@s.whatsapp.net">
    <button id="trust-add">Trust</button>
    <ul id="trust-list"></ul>
  </section>
  <section id="tab-schedules" hidden>
    <table id="schedules-table"></table>
  </section>
  <section id="tab-drafts" hidden>
    <p>Sends an agent proposed and is waiting on. Approving delivers immediately (rate-limited).</p>
    <table id="drafts-table"></table>
  </section>
  <section id="tab-backup" hidden>
    <button id="backup-go">Back up messages now</button>
    <p id="backup-result"></p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
